<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SmartWarehouse - Dashboard GPS</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <!-- FontAwesome Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Estilos Globales -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <div class="app-layout">
    <!-- Panel Lateral / Control Inferior Móvil -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="user-profile">
          <img id="userAvatar" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Avatar" class="avatar">
          <div class="user-info">
            <strong id="userName">Operario</strong>
            <span id="userEmail" class="email">operario@almacen.com</span>
          </div>
          <!-- BOTÓN SALIR CORREGIDO -->
          <button class="btn-logout" onclick="window.logout()" title="Cerrar Sesión">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </div>

      <!-- Control de Rol / Pestañas -->
      <div class="mode-switch">
        <button id="btnUser" class="btn-tab active" onclick="app.setRole('user')">
          <i class="fa-solid fa-route"></i> Navegar
        </button>
        <!-- Botón Admin (oculto por defecto) -->
        <button id="btnAdmin" class="btn-tab hidden" onclick="app.setRole('admin')">
          <i class="fa-solid fa-user-gear"></i> Mapear Admin
        </button>
      </div>

      <!-- Panel del Operario -->
      <section id="userPanel" class="panel active">
        <div class="card card-gps">
          <h3><i class="fa-solid fa-satellite-dish"></i> Estado GPS Operario</h3>
          <div class="status-indicator">
            <span class="pulse-dot"></span>
            <span id="gpsStatusText">Buscando GPS...</span>
          </div>
          <button class="btn btn-secondary" onclick="app.centerMapOnWarehouse()">
            <i class="fa-solid fa-warehouse"></i> Enfocar Staging Area
          </button>
        </div>

        <div class="card">
          <h3><i class="fa-solid fa-magnifying-glass"></i> Buscar Tienda / Slot</h3>
          <div class="form-group">
            <input type="text" id="searchInput" placeholder="Ej: 1615, 1723, STAGING" onkeypress="app.handleSearchKeyPress(event)">
          </div>
          <button class="btn btn-primary" onclick="app.searchAndRoute()">
            <i class="fa-solid fa-diamond-turn-right"></i> Trazar Ruta GPS
          </button>
          <button class="btn btn-danger-outline" onclick="app.clearCurrentRoute()">
            <i class="fa-solid fa-xmark"></i> Limpiar Ruta
          </button>
        </div>

        <div id="routeInfoCard" class="card card-route hidden">
          <h3><i class="fa-solid fa-route"></i> Telemetría de Ruta</h3>
          <div class="telemetry-grid">
            <div><span>Distancia:</span> <strong id="routeDist">0 m</strong></div>
            <div><span>Destino:</span> <strong id="routeTarget">-</strong></div>
          </div>
        </div>
      </section>

      <!-- Panel Mapeo Admin -->
      <section id="adminPanel" class="panel">
        <div class="card">
          <h3><i class="fa-solid fa-map-pin"></i> Mapear Posición Exacta</h3>
          <button class="btn btn-secondary" onclick="app.useCurrentGPSForAdmin()">
            <i class="fa-solid fa-location-dot"></i> Capturar Mi GPS
          </button>
          <div class="coords-box" id="adminCoordsBox">Sin selección de coordenadas</div>
          <div class="form-group">
            <label>Código de Slot / Tienda</label>
            <input type="text" id="adminCodeInput" placeholder="Ej: 1723">
          </div>
          <div class="form-group">
            <label>Zona Perteneciente</label>
            <select id="adminZoneSelect">
              <option value="STAGING">STAGING CENTRAL</option>
              <option value="ZONA VIRÚ">ZONA VIRÚ</option>
              <option value="ZONA CHICAMA">ZONA CHICAMA</option>
              <option value="ZONA CHIMBOTE A">ZONA CHIMBOTE A</option>
              <option value="ZONA CHIMBOTE B">ZONA CHIMBOTE B</option>
              <option value="ZONA TRUJILLO">ZONA TRUJILLO</option>
              <option value="ZONA MASS">ZONA MASS</option>
              <option value="PICKING GENERAL">PICKING GENERAL</option>
            </select>
          </div>
          <button class="btn btn-success" onclick="app.saveWaypoint()">
            <i class="fa-solid fa-floppy-disk"></i> Guardar en Google Sheets
          </button>
        </div>

        <div class="card">
          <h3><i class="fa-solid fa-list-check"></i> Slots Registrados (<span id="wpCount">0</span>)</h3>
          <div id="waypointsList" class="wp-scroll-container"></div>
        </div>
      </section>
    </aside>

    <!-- Contenedor del Mapa Leaflet -->
    <main class="map-viewport">
      <div id="map"></div>
    </main>
  </div>

  <!-- JavaScript Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/utils/crypto.js"></script>
  <script src="js/config.js"></script>
  <script src="js/services/apiService.js"></script>
  <script src="js/data/storeRepository.js"></script>
  <script src="js/services/gpsService.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/controllers/appController.js"></script>

  <script>
    // 1. Validar sesión del usuario al cargar la página
    checkAppSession();
    
    // 2. Esperar a que el DOM esté listo para aplicar los roles (ocultar/mostrar admin)
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(applyUserRole, 150); 
    });
  </script>
</body>
</html>

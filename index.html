<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SmartWarehouse - Iniciar Sesión</title>

  <!-- Google Identity Services Library -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- FontAwesome Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Estilos Globales -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="brand-logo">
      <i class="fa-solid fa-warehouse"></i>
    </div>
    <h2>SmartWarehouse PWA</h2>
    <p>Navegación Interna y Mapeo Georreferenciado</p>

    <!-- Botón Google OAuth -->
    <div class="google-btn-wrapper">
      <div id="g_id_onload"
           data-client_id="123456789012-abc123def456.apps.googleusercontent.com"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin" 
           data-type="standard" 
           data-shape="rectangular" 
           data-theme="outline" 
           data-text="signin_with" 
           data-size="large" 
           data-logo_alignment="left">
      </div>
    </div>

    <!-- Opción Mantener Sesión -->
    <div class="remember-option">
      <input type="checkbox" id="rememberMe">
      <label for="rememberMe">Mantener sesión iniciada en este dispositivo</label>
    </div>

    <div class="divider">ó</div>

    <!-- Acceso Directo Demo Garantizado Sin Bloqueos -->
    <button class="btn-secondary-login" type="button" id="btnDemoLogin">
      <i class="fa-solid fa-user-gear"></i> Entrar como Operario Demo
    </button>
  </div>

  <!-- Carga Secuencial de Scripts para Seguridad y Sincronización -->
  <script src="js/utils/crypto.js"></script>
  <script src="js/config.js"></script>
  <script src="js/services/apiService.js"></script>
  <script src="js/auth.js"></script>

  <script>
    // Manejo directo del botón de acceso Demo
    document.getElementById('btnDemoLogin').addEventListener('click', function(e) {
      e.preventDefault();
      
      const demoUser = {
        name: "Operario Almacén",
        email: "operario@almacen.com",
        picture: "https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
      };

      const remember = document.getElementById('rememberMe').checked;

      // Guardar datos en la memoria correspondiente para evitar rebotar al cargar app.html
      if (remember) {
        localStorage.setItem('sw_session_user', JSON.stringify(demoUser));
      } else {
        sessionStorage.setItem('sw_session_user', JSON.stringify(demoUser));
      }

      // Sincronizar ingreso en Google Sheets en segundo plano
      if (typeof apiService !== 'undefined') {
        apiService.syncUser(demoUser);
      }

      // Redirección directa e inmediata a app.html
      window.location.href = 'app.html';
    });
  </script>
</body>
</html>

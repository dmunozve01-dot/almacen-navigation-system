<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SmartWarehouse - Iniciar Sesión</title>

  <!-- Google Identity Services Library -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- FontAwesome Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Estilos Globales -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="brand-logo">
      <i class="fa-solid fa-warehouse"></i>
    </div>
    <h2>SmartWarehouse PWA</h2>
    <p>Navegación Interna y Mapeo Georreferenciado</p>

    <!-- Botón Google OAuth -->
    <div class="google-btn-wrapper">
      <div id="g_id_onload"
           data-client_id="123456789012-abc123def456.apps.googleusercontent.com"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin" 
           data-type="standard" 
           data-shape="rectangular" 
           data-theme="outline" 
           data-text="signin_with" 
           data-size="large" 
           data-logo_alignment="left">
      </div>
    </div>

    <!-- Opción Mantener Sesión (sessionStorage vs localStorage) -->
    <div class="remember-option">
      <input type="checkbox" id="rememberMe">
      <label for="rememberMe">Mantener sesión iniciada</label>
    </div>

    <div class="divider">ó</div>

    <!-- Acceso Directo de Prueba para Operario -->
    <button class="btn-secondary-login" onclick="loginDemo()">
      <i class="fa-solid fa-user-gear"></i> Entrar como Operario Demo
    </button>
  </div>

  <!-- Scripts: Seguridad, Configuración Encriptada, API y Autenticación -->
  <script src="js/utils/crypto.js"></script>
  <script src="js/config.js"></script>
  <script src="js/services/apiService.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

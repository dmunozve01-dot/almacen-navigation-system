<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SmartWarehouse - Login</title>
  
  <script>
    window.handleCredentialResponse = function(response) { 
      if(typeof handleCredentialResponse === 'function') handleCredentialResponse(response); 
    };
  </script>
  
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="./css/main.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="brand-logo"><i class="fa-solid fa-warehouse"></i></div>
    <h2>SmartWarehouse</h2>
    <p>Ingreso al Sistema</p>

    <div class="google-btn-wrapper">
      <div id="g_id_onload" data-client_id="606508682227-kaoi6vcv5bphorgt2449hq54af12p9gk.apps.googleusercontent.com" data-callback="handleCredentialResponse" data-auto_prompt="false"></div>
      <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline" data-text="signin_with" data-size="large"></div>
    </div>

    <div class="remember-option">
      <input type="checkbox" id="rememberMe">
      <label for="rememberMe">Mantener sesión</label>
    </div>
    <div class="divider"><span>o</span></div>
    <button class="btn-secondary-login" type="button" id="btnDemoLogin"><i class="fa-solid fa-user-gear"></i> Entrar como Demo</button>
  </div>

  <script src="./js/core/crypto.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/core/apiService.js"></script>
  <script src="./js/auth.js"></script>

  <!-- SCRIPT DE SEGURIDAD: Si ya está logueado, no puede ver el login -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = sessionStorage.getItem('sw_user') || localStorage.getItem('sw_user');
      if (user) {
        window.location.replace('app.html');
      }
    });
  </script>
</body>
</html>
